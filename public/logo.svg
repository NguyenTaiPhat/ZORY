<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Shadow -->
    <filter id="iconDropShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>

    <!-- Z Body Glow & Depth -->
    <filter id="glow3D" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#8B5CF6" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <!-- Clean White Gradient Background -->
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Flowing AI Spectrum Gradient for Thick Z -->
    <linearGradient id="thickZGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="28%" stop-color="#F43F5E"/>
      <stop offset="60%" stop-color="#A855F7"/>
      <stop offset="85%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Rounded Amber Star Gradient -->
    <linearGradient id="aiStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Rounded Cyan Star Gradient -->
    <linearGradient id="aiCyanStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Clean White Squircle Background -->
  <rect x="20" y="20" width="472" height="472" rx="116"
        fill="url(#bgGradLight)"
        filter="url(#iconDropShadow)"/>
  <rect x="20" y="20" width="472" height="472" rx="116"
        fill="none"
        stroke="#E2E8F0"
        stroke-width="2.5"/>

  <!-- Symmetrical Thick Rounded AI Glyph Z (Centered at 256, 256) -->
  <g filter="url(#glow3D)">
    <path d="M 166 146 L 346 146 L 166 366 L 346 366"
          fill="none"
          stroke="url(#thickZGrad)"
          stroke-width="64"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Solid Rounded AI Sparkle Star (Top Right - No Hole, Rounded Tips & Edges) -->
  <g transform="translate(402, 110)">
    <path d="M -4 -22
             A 4 4 0 0 1 4 -22
             C 4.8 -7.2, 7.2 -4.8, 22 -4
             A 4 4 0 0 1 22 4
             C 7.2 4.8, 4.8 7.2, 4 22
             A 4 4 0 0 1 -4 22
             C -4.8 7.2, -7.2 4.8, -22 4
             A 4 4 0 0 1 -22 -4
             C -7.2 -4.8, -4.8 -7.2, -4 -22 Z"
          fill="url(#aiStarGrad)"/>
  </g>

  <!-- Solid Rounded AI Sparkle Star (Bottom Left - No Hole, Rounded Tips & Edges) -->
  <g transform="translate(110, 402)">
    <path d="M -3 -15
             A 3 3 0 0 1 3 -15
             C 3.6 -5.4, 5.4 -3.6, 15 -3
             A 3 3 0 0 1 15 3
             C 5.4 3.6, 3.6 5.4, 3 15
             A 3 3 0 0 1 -3 15
             C -3.6 5.4, -5.4 3.6, -15 3
             A 3 3 0 0 1 -15 -3
             C -5.4 -3.6, -3.6 -5.4, -3 -15 Z"
          fill="url(#aiCyanStarGrad)"/>
  </g>
</svg>
